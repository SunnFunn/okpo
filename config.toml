[source]
base_unc = "\\\\mskfs.rusagrotrans.ru\\Groups\\Департамент транспортно-экспедиционного обслуживания\\ДТЭО new\\Реестры"

[schedule]
timezone = "Europe/Moscow"
hour = 4
minute = 0

[ssh]
host = "10.101.139.4"
port = 22
user = "atretyakov"
private_key = "C:\\Users\\tretyakov_av\\.ssh\\id_rsa"
remote_dir = "/home/atretyakov/okpo-agent/data/registers"

# По умолчанию okpo только ssh -R + register (файлы с mount /data/registers на Ubuntu).
# Запасной режим Windows: okpo.exe --once --skip-register-sync  → SFTP + agent --skip-register-sync
[agent]
enabled = true
remote_socks_port = 3128
working_directory = "/home/atretyakov/okpo-agent"
remote_command = "OKPO_SKIP_BUILD=1 OKPO_API_ENV=prod ./run.sh prod register --dadata-parse"
ssh_binary = "ssh"

# Режим --test-check: JSON-экспорт с прод + 2 SQL + Excel-отчёт
[test_check]
remote_exports_dir = "/home/atretyakov/okpo-agent/data/exports"
export_prefix = "register_export"
python_binary = "python"
script_path = "test/assignments.py"
registers_days = 5
invoices_days = 60
report_dir = "tmp"
